name: Provision Vultr Resources
on: push
jobs:
  build-artifact:
    name: Build RAW image artifact
    runs-on: ubuntu-latest
    steps:
      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        id: setup

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            xorriso

      #- name: Generate SSH key pair
      #  run: |
      #    mkdir -p $HOME/.ssh
      #    ssh-keygen -t rsa -b 4096 -f $HOME/.ssh/packer_key -N "" -q
      #    echo "SSH public key:"
      #    cat $HOME/.ssh/packer_key.pub

      - name: Configure SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/packer_key
          chmod 600 ~/.ssh/packer_key

          test -f ~/.ssh/packer_key

      - name: Packer Init
        working-directory: packer/
        run: packer init .

      - name: Validate Packer template
        working-directory: packer/
        run: |
          packer validate \
            -var "iso_url=${{ vars.ISO_URL }}" \
            -var "iso_checksum=${{ vars.ISO_CHECKSUM }}" \
            -var "base_os_url=${{ vars.BASE_OS_URL }}" \
            -var "app_stream_url=${{ vars.APP_STREAM_URL }}" \
            -var "output_directory=output/almalinux" \
            -var "ssh_private_key_file=$HOME/.ssh/packer_key" \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "ssh_username=${{ secrets.SSH_USERNAME }}" \
            .
        
      - name: Packer Build - Branches
        working-directory: packer/
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          packer build \
            -var "iso_url=${{ vars.ISO_URL }}" \
            -var "iso_checksum=${{ vars.ISO_CHECKSUM }}" \
            -var "base_os_url=${{ vars.BASE_OS_URL }}" \
            -var "app_stream_url=${{ vars.APP_STREAM_URL }}" \
            -var "output_directory=output/almalinux" \
            -var "ssh_private_key_file=$HOME/.ssh/packer_key" \
            -var "ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
            -var "ssh_username=${{ secrets.SSH_USERNAME }}" \
            .

      - name: Verify RAW image
        run: |
          qemu-img info output/almalinux/almalinux-10.raw
          qemu-img check -f raw output/almalinux/almalinux-10.raw

      - name: Calculate checksum
        run: |
          sha256sum output/almalinux/almalinux-10.raw \
            > output/almalinux/SHA256SUMS
      
      - name: Upload RAW image
        uses: actions/upload-artifact@v4
        with:
          name: almalinux-10-raw
          path: output/almalinux/
          if-no-files-found: error
          retention-days: 14
      
  provision:
    name: Provision Vultr Resources
    needs: build-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.6

      - name: Initialize Terraform
        working-directory: terraform/vultr
        run: terraform init

      - name: Apply Terraform configuration
        run: terraform init -backend-config=backend.hcl && terraform apply -auto-approve -var="vultr_api_key=${{ secrets.VULTR_API_KEY }}" -var="vultr_ssh_key_id=${{ secrets.VULTR_SSH_KEY_ID }}" -var="vultr_ssh_key_name=${{ secrets.VULTR_SSH_KEY_NAME }}"