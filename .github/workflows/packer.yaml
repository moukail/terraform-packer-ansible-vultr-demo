name: Provision Vultr Resources

on:
  push:
    branches:
      - main

jobs:  
  build-artifact:
    name: Build RAW image artifact
    #needs: check-artifact
    #if: needs.check-artifact.outputs.artifact_exists == 'false'
    runs-on: [self-hosted, linux, x64, kvm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Packer
        uses: hashicorp/setup-packer@main
        id: setup

      - name: Install dependencies
        if : runner.os == 'Ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            xorriso \
            ansible

            aws --version

      - name: Configure KVM permissions
        if : runner.os == 'Ubuntu'
        shell: bash
        run: |
          set -euo pipefail

          echo "Adding runner to KVM group"
          sudo usermod -aG kvm "$USER"

          echo "Checking KVM device"
          ls -l /dev/kvm

          echo "Testing KVM access"
          sg kvm -c "id && test -r /dev/kvm && test -w /dev/kvm"

          echo "KVM access successfully verified"

      - name: Generate SSH key pair
        run: |
          mkdir -p $HOME/.ssh
          rm -f "$HOME/.ssh/packer_ansible_key"
          rm -f "$HOME/.ssh/packer_ansible_key.pub"
          ssh-keygen -t ed25519 -f $HOME/.ssh/packer_ansible_key -N "" -q

      - name: Packer Init
        working-directory: packer/
        run: packer init .

      - name: Validate Packer template
        working-directory: packer/
        run: |
          # For Ubuntu use qemu_binary=qemu-system-x86_64
          packer validate \
            -var "iso_url=${{ vars.ISO_URL }}" \
            -var "iso_checksum=${{ vars.ISO_CHECKSUM }}" \
            -var "base_os_url=${{ vars.BASE_OS_URL }}" \
            -var "app_stream_url=${{ vars.APP_STREAM_URL }}" \
            -var "output_directory=$GITHUB_WORKSPACE/output/almalinux" \
            -var "ansible_ssh_private_key_file=$HOME/.ssh/packer_ansible_key" \
            -var "ansible_ssh_public_key=$(cat $HOME/.ssh/packer_ansible_key.pub)" \
            -var "ssh_username=${{ secrets.SSH_USERNAME }}" \
            -var "qemu_binary=/usr/libexec/qemu-kvm" \
            -var "vm_name=almalinux10_x86_64.raw" \
            .
        
      - name: Packer Build
        working-directory: packer/
        shell: bash
        run: |
          # For Ubuntu use qemu_binary=qemu-system-x86_64
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/output/almalinux"

          sg kvm -c "packer build \
            -var 'iso_url=${{ vars.ISO_URL }}' \
            -var 'iso_checksum=${{ vars.ISO_CHECKSUM }}' \
            -var 'base_os_url=${{ vars.BASE_OS_URL }}' \
            -var 'app_stream_url=${{ vars.APP_STREAM_URL }}' \
            -var 'output_directory=$GITHUB_WORKSPACE/output/almalinux' \
            -var 'ansible_ssh_private_key_file=$HOME/.ssh/packer_ansible_key' \
            -var 'ansible_ssh_public_key=$(cat $HOME/.ssh/packer_ansible_key.pub)' \
            -var 'ssh_username=${{ secrets.SSH_USERNAME }}' \
            -var 'qemu_binary=/usr/libexec/qemu-kvm' \
            -var "vm_name=almalinux10_x86_64.raw" \
            ."

            mv $GITHUB_WORKSPACE/output/almalinux/packer_qemu $GITHUB_WORKSPACE/output/almalinux/almalinux-10.raw

      - name: Cleanup SSH keys
        if: always()
        run: |
          rm -f "$HOME/.ssh/packer_ansible_key"
          rm -f "$HOME/.ssh/packer_ansible_key.pub"

      - name: Calculate checksum
        run: |
          sha256sum $GITHUB_WORKSPACE/output/almalinux/almalinux-10.raw \
            > $GITHUB_WORKSPACE/output/almalinux/SHA256SUMS
      
      - name: List image artifacts
        run: |
          echo "Artifact directory:"
          ls -lah "$GITHUB_WORKSPACE/output/almalinux/"

          test -s "$GITHUB_WORKSPACE/output/almalinux/almalinux-10.raw"
          test -s "$GITHUB_WORKSPACE/output/almalinux/SHA256SUMS"

          echo "All expected artifacts exist"

      #- name: Upload RAW image
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: almalinux-10-raw
      #    path: ${{ github.workspace }}/output/almalinux/
      #    if-no-files-found: error
      #    retention-days: 14
      #    compression-level: 0
      
      - name: Upload image to Vultr
        uses: ./.github/actions/vultr-object-storage-upload
        with:
          image: ${{ github.workspace }}/output/almalinux/almalinux-10.raw
          bucket: packer-images
          endpoint: https://ams1.vultrobjects.com
          access-key: ${{ secrets.VULTR_S3_ACCESS_KEY }}
          secret-key: ${{ secrets.VULTR_S3_SECRET_KEY }}

  provision:
    name: Provision Vultr Resources
    needs: 
      #- check-artifact
      - build-artifact
    #if: |
    #  always() &&
    #  needs.check-artifact.result == 'success' &&
    #  (
    #    needs.build-artifact.result == 'success' ||
    #    needs.build-artifact.result == 'skipped'
    #  )  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize Terraform
        working-directory: terraform/vultr
        run: terraform init

      - name: Apply Terraform configuration
        working-directory: terraform/vultr
        run: |
          terraform init -backend-config=backend.hcl && \
          terraform apply -auto-approve \
          -var="vultr_api_key=${{ secrets.VULTR_API_KEY }}" \
          -var="user_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
          -var="ssh_key_name=${{ vars.VULTR_SSH_KEY_NAME }}" \
          -var="my_snapshot_url=https://local.moukail.nl/files/almalinux_10/almalinux10_x86_64.raw"