name: Provision with Terraform

on: [workflow_call]

jobs:
  terraform:
    name: Provision with Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform/vultr

    env:
      VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ams1
      IMAGE_URL: ${{ needs.build-artifact.outputs.image-url || needs.check-artifact.outputs.image-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Initialize Terraform
        run: |
          terraform init \
            -backend-config=backend.hcl \
            -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan \
          -var="vultr_api_key=${{ secrets.VULTR_API_KEY }}" \
          -var="user_ssh_public_key=${{ secrets.SSH_PUBLIC_KEY }}" \
          -var="ssh_key_name=${{ vars.VULTR_SSH_KEY_NAME }}" \
          -var="my_snapshot_url=$IMAGE_URL"

      - name: Apply Terraform configuration
        run: terraform apply -auto-approve tfplan